server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side, so any path that isn't
    # a real static file falls back to index.html instead of nginx
    # returning its own 404 — otherwise refreshing /past/2026-07 breaks.
    location / {
        try_files $uri /index.html;
    }
}
